name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile binaries
        run: sh scripts/release.sh "${GITHUB_REF_NAME}" --dry
      - name: Publish or upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/collie-* dist/checksums.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/collie-* dist/checksums.txt \
              --title "Collie ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
