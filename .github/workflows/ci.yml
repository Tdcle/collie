name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v ./...
      - run: go build .
      - name: Verify frontend JS syntax & demo build
        if: matrix.os != 'windows-latest'
        run: |
          node --check web/highlight.js
          node --check web/math.js
          node --check web/quota.js
          node --check web/artifacts.js
          node --check web/app.js
          node --check scripts/demo/demo.js
          node scripts/check-web.mjs
          sh scripts/demo.sh
          node --check docs/demo/app.js
      - name: Smoke test Windows installer (dry service)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          COLLIE_NO_HERDR: "1"
          COLLIE_DRY_SERVICE: "1"
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "collie-bin"
          $env:COLLIE_BIN_DIR = $binDir
          powershell -ExecutionPolicy Bypass -File docs\install.ps1 hub --url http://127.0.0.1:7788
          & (Join-Path $binDir "collie.exe") version
